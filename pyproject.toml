[project]
name = "eduagent-backend"
version = "0.1.0"
description = "Learner-aware adaptive AI classroom platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28,<0.29",
    "asyncpg>=0.31.0",
    "eduagent-course-dsl",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.workspace]
members = [
    "packages/course-dsl",
]

[tool.uv.sources]
eduagent-course-dsl = { workspace = true, editable = true }
